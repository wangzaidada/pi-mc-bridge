# pi-mc-bridge example configuration (INI subset)
#
# Load with:   ./pi-mc-bridge --config config.example.ini --rcon-pass <password>
# or:          CONFIG_FILE=config.example.ini ./pi-mc-bridge --rcon-pass <password>
#
# Precedence:  command line > environment variable > this file > built-in default.
# A CLI option or env var overrides the matching [global] value below.
#
# Comments run from '#' or ';' to end of line and must occupy their own line;
# there are no inline comments. Values are trimmed of surrounding whitespace.
#
# NOTE: this bridge is a thin transport between the game server and the `pi` CLI.
#       It does NOT author prompts. There is deliberately no prompt/system key —
#       customizing the model's behaviour is done on the pi side, not here.

[global]
rcon_host = 127.0.0.1
rcon_port = 25575
# Prefer --rcon-pass / RCON_PASSWORD over storing the password here.
# rcon_pass = your-rcon-password
log_file = logs/latest.log
# per trigger+player, in seconds
cooldown = 10
# characters per reply, counted by codepoint
max_len = 200
# empty = everyone; otherwise e.g. Steve,Alex
allow =
# pi_cmd = pi
# pi_model = mc-gw/deepseek/deepseek-v4.1-flash
# log_level = info

# --- Trigger 1: chat dialogue ---
# "@pi ..." or "@ai ..." reaches the dialog executor, which calls pi.
[trigger:chat]
# chat line: <player> <keyword> <text>
match = chat
keywords = @pi, @ai
# must agree with `match`
extractor = chat
executor = dialog
# seconds; -1 or omitted => inherit [global]
# cooldown = 10
# omitted => inherit [global]
# max_len = 200
# model = mc-gw/deepseek/deepseek-v4.1-flash
# reply_prefix = [AI]
# the only shaper this change ships
# reply_shaper = text

# --- Trigger 2: player join greeting ---
# A keyword trigger that matches "joined the game" and replies from a
# template. The replier never calls pi — it just substitutes and sends.
[trigger:join]
match = keyword
keywords = joined the game
extractor = keyword
executor = replier
template = 欢迎 {player} 加入服务器！

# ---------------------------------------------------------------------------
# Command executor is NOT part of this change. It will arrive in a separate
# change (`add-command-executor`) and will be off by default behind a command
# whitelist. Writing `executor = command` here is rejected as an unknown
# executor. Do not pre-enable anything: RCON equals server-console privileges,
# and AI output must be treated as untrusted.
# ---------------------------------------------------------------------------
